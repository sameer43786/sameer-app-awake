name: Temporary Build Sameer Live Translator v1.0.0
on:
  push:
    branches:
      - temp-build-sameer-live-translator-v1.0.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        working-directory: translator-build
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp translator-build/app/build/outputs/apk/debug/app-debug.apk SameerLiveTranslator-v1.0.0-debug.apk

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: SameerLiveTranslator-v1.0.0-debug
          path: SameerLiveTranslator-v1.0.0-debug.apk
          if-no-files-found: error
          retention-days: 1
