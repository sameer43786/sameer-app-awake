name: Build SAM Ad Shield APK

on:
  push:
    branches:
      - sam-ad-shield-build-20260823
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Reconstruct SAM Ad Shield source
        shell: bash
        run: |
          cat .sam_ad_shield_src.part01 \
              .sam_ad_shield_src.part02 \
              .sam_ad_shield_src.part03 \
              .sam_ad_shield_src.part04 \
              .sam_ad_shield_src.part05 | base64 --decode > SAM_Ad_Shield_v1.0.0_Source.zip
          unzip -q SAM_Ad_Shield_v1.0.0_Source.zip
          test -f SAM_Ad_Shield_v1.0.0/app/build.gradle

      - name: Install Android API 36 build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Run DNS engine self-test
        shell: bash
        working-directory: SAM_Ad_Shield_v1.0.0
        run: |
          mkdir -p /tmp/samtest
          javac -d /tmp/samtest \
            app/src/main/java/com/sameerali/samadshield/DomainMatcher.java \
            app/src/main/java/com/sameerali/samadshield/DnsPacket.java \
            EngineSelfTest.java
          java -cp /tmp/samtest EngineSelfTest | tee /tmp/engine-self-test.txt
          grep -q "ENGINE_SELF_TEST=PASS" /tmp/engine-self-test.txt

      - name: Build installable debug APK
        shell: bash
        working-directory: SAM_Ad_Shield_v1.0.0
        run: gradle clean assembleDebug --stacktrace --no-daemon

      - name: Validate and name APK
        shell: bash
        run: |
          cp SAM_Ad_Shield_v1.0.0/app/build/outputs/apk/debug/app-debug.apk SAM_Ad_Shield_v1.0.0.apk
          test -s SAM_Ad_Shield_v1.0.0.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose SAM_Ad_Shield_v1.0.0.apk
          sha256sum SAM_Ad_Shield_v1.0.0.apk > SAM_Ad_Shield_v1.0.0.apk.sha256
          ls -lh SAM_Ad_Shield_v1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAM_Ad_Shield_v1.0.0
          if-no-files-found: error
          retention-days: 7
          path: |
            SAM_Ad_Shield_v1.0.0.apk
            SAM_Ad_Shield_v1.0.0.apk.sha256
