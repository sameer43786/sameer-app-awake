name: Temporary SAM Ad Shield v1.3.0 APK Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sam-ad-shield-v130:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'sam-ad-shield-build-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Reconstruct verified v1.0 source
        shell: bash
        run: |
          cat .sam_ad_shield_src.part01 \
              .sam_ad_shield_src.part02_01 \
              .sam_ad_shield_src.part02_02 \
              .sam_ad_shield_src.part02_03 \
              .sam_ad_shield_src.part02_04 \
              .sam_ad_shield_src.part02_05 \
              .sam_ad_shield_src.part02_06 \
              .sam_ad_shield_src.part02_07 \
              .sam_ad_shield_src.part02_08 \
              .sam_ad_shield_src.part02_09 \
              .sam_ad_shield_src.part02_10 \
              .sam_ad_shield_src.part02_11 \
              .sam_ad_shield_src.part02_12 \
              .sam_ad_shield_src.part02_13 \
              .sam_ad_shield_src.part02_14 \
              .sam_ad_shield_src.part02_15 \
              .sam_ad_shield_src.part02_16 \
              .sam_ad_shield_src.part03 \
              .sam_ad_shield_src.part04 \
              .sam_ad_shield_src.part05_01 \
              .sam_ad_shield_src.part05_02 \
              .sam_ad_shield_src.part05_03 \
              .sam_ad_shield_src.part05_04 \
              .sam_ad_shield_src.part05_05 \
              .sam_ad_shield_src.part05_06 \
              .sam_ad_shield_src.part05_07 \
              .sam_ad_shield_src.part05_08 \
              .sam_ad_shield_src.part05_09 | base64 --decode > SAM_Ad_Shield_v1.0.0_Source.zip
          echo "135a8d2f6b27a6087537efe9064676ed42e8236911ec847c329593533a546aa6  SAM_Ad_Shield_v1.0.0_Source.zip" | sha256sum -c -
          unzip -q SAM_Ad_Shield_v1.0.0_Source.zip
          test -f SAM_Ad_Shield_v1.0.0/app/build.gradle

      - name: Overlay verified v1.1.0 fixes
        shell: bash
        run: |
          cat .sam_v110_overlay.part01 \
              .sam_v110_overlay.part02 \
              .sam_v110_overlay.part03 \
              .sam_v110_overlay.part04 | base64 --decode > sam_v110_overlay.tar.gz
          echo "9441cd10c3a1da9780b576560df2a5eb0ccb45e74a2adb0e4f08b628d26399e4  sam_v110_overlay.tar.gz" | sha256sum -c -
          tar -xzf sam_v110_overlay.tar.gz -C SAM_Ad_Shield_v1.0.0
          grep -q "versionName '1.1.0'" SAM_Ad_Shield_v1.0.0/app/build.gradle
          grep -q 'ACCESS_NETWORK_STATE' SAM_Ad_Shield_v1.0.0/app/src/main/AndroidManifest.xml
          grep -q 'DnsResolver.getInstance().rawQuery' SAM_Ad_Shield_v1.0.0/app/src/main/java/com/sameerali/samadshield/DnsVpnService.java
          test -f SAM_Ad_Shield_v1.0.0/app/src/main/java/com/sameerali/samadshield/YouTubeAdAssistService.java

      - name: Overlay verified v1.2.0 fixes
        shell: bash
        run: |
          cat .sam_v120_overlay.part01 \
              .sam_v120_overlay.part02 \
              .sam_v120_overlay.part03 | base64 --decode > sam_v120_overlay.tar.gz
          echo "0eb5e279dd8aa4be1c4dcf8ff512ff6943651443222771fc222151719e6e6933  sam_v120_overlay.tar.gz" | sha256sum -c -
          tar -xzf sam_v120_overlay.tar.gz -C SAM_Ad_Shield_v1.0.0
          grep -q "versionName '1.2.0'" SAM_Ad_Shield_v1.0.0/app/build.gradle
          grep -q 'android:canPerformGestures="true"' SAM_Ad_Shield_v1.0.0/app/src/main/res/xml/youtube_ad_assist_service.xml
          grep -q 'Sponsored' SAM_Ad_Shield_v1.0.0/app/src/main/java/com/sameerali/samadshield/YouTubeAdAssistService.java

      - name: Overlay v1.3.0 Pixel, DNS and YouTube fixes
        shell: bash
        run: |
          cat .sam_v130_overlay.part01 \
              .sam_v130_overlay.part02 \
              .sam_v130_overlay.part03 | base64 --decode > sam_v130_overlay.tar.gz
          echo "b053107ece59067d9225a2fc639cfdaf6dbbc576c8a9bd6b8daf44bcc30d56b7  sam_v130_overlay.tar.gz" | sha256sum -c -
          tar -xzf sam_v130_overlay.tar.gz -C SAM_Ad_Shield_v1.0.0
          grep -q "versionName '1.3.0'" SAM_Ad_Shield_v1.0.0/app/build.gradle
          grep -q 'QUERY_ADVANCED_PROTECTION_MODE' SAM_Ad_Shield_v1.0.0/app/src/main/AndroidManifest.xml
          grep -q 'AdvancedProtectionManager' SAM_Ad_Shield_v1.0.0/app/src/main/java/com/sameerali/samadshield/MainActivity.java
          grep -q 'TYPE_ACCESSIBILITY_OVERLAY' SAM_Ad_Shield_v1.0.0/app/src/main/java/com/sameerali/samadshield/YouTubeAdAssistService.java
          grep -q '__SAM_AD_SHIELD_13' SAM_Ad_Shield_v1.0.0/app/src/main/java/com/sameerali/samadshield/CleanYouTubeActivity.java

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Run DNS engine self-test
        shell: bash
        working-directory: SAM_Ad_Shield_v1.0.0
        run: |
          mkdir -p /tmp/samtest
          javac -d /tmp/samtest \
            app/src/main/java/com/sameerali/samadshield/DomainMatcher.java \
            app/src/main/java/com/sameerali/samadshield/DnsPacket.java \
            EngineSelfTest.java
          java -cp /tmp/samtest EngineSelfTest | tee /tmp/engine-self-test.txt
          grep -q "ENGINE_SELF_TEST=PASS" /tmp/engine-self-test.txt

      - name: Build APK
        shell: bash
        working-directory: SAM_Ad_Shield_v1.0.0
        run: gradle clean assembleDebug --stacktrace --no-daemon

      - name: Validate APK
        shell: bash
        run: |
          cp SAM_Ad_Shield_v1.0.0/app/build/outputs/apk/debug/app-debug.apk SAM_Ad_Shield_v1.3.0.apk
          test -s SAM_Ad_Shield_v1.3.0.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose SAM_Ad_Shield_v1.3.0.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging SAM_Ad_Shield_v1.3.0.apk | tee /tmp/badging.txt
          grep -q "versionName='1.3.0-debug'" /tmp/badging.txt
          grep -q "package: name='com.sameerali.samadshield.debug'" /tmp/badging.txt
          sha256sum SAM_Ad_Shield_v1.3.0.apk > SAM_Ad_Shield_v1.3.0.apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SAM_Ad_Shield_v1.3.0
          if-no-files-found: error
          retention-days: 7
          path: |
            SAM_Ad_Shield_v1.3.0.apk
            SAM_Ad_Shield_v1.3.0.apk.sha256
