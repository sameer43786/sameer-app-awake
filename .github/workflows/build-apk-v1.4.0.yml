name: Build App Awake v1.7.1 APK

on:
  push:
    branches:
      - agent/build-apk-v1.4.0
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply v1.7.1 centered-menu patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          browser = Path("app/src/main/java/com/sameerali/appawake/ProtectedBrowserActivity.java")
          text = browser.read_text(encoding="utf-8")

          old_gravity = "Gravity.TOP | Gravity.END"
          old_margins = "handleParams.setMargins(0, dp(7), dp(7), 0);"
          assert text.count(old_gravity) == 1, "Unexpected floating-handle gravity source state"
          assert text.count(old_margins) == 1, "Unexpected floating-handle margin source state"

          text = text.replace(old_gravity, "Gravity.TOP | Gravity.CENTER_HORIZONTAL", 1)
          text = text.replace(old_margins, "handleParams.setMargins(0, dp(7), 0, 0);", 1)
          browser.write_text(text, encoding="utf-8")

          gradle = Path("app/build.gradle.kts")
          g = gradle.read_text(encoding="utf-8")
          assert 'versionCode = 12' in g, "Unexpected source versionCode"
          assert 'versionName = "1.7.0"' in g, "Unexpected source versionName"
          g = g.replace('versionCode = 12', 'versionCode = 13', 1)
          g = g.replace('versionName = "1.7.0"', 'versionName = "1.7.1"', 1)
          gradle.write_text(g, encoding="utf-8")
          PY

      - name: Verify v1.7.1 centered full-screen browser configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'versionCode = 13' app/build.gradle.kts
          grep -q 'versionName = "1.7.1"' app/build.gradle.kts
          grep -q 'HomeActivity' app/src/main/AndroidManifest.xml
          grep -q 'ProtectedBrowserActivity' app/src/main/AndroidManifest.xml
          grep -q 'FLAG_KEEP_SCREEN_ON' app/src/main/java/com/sameerali/appawake/ProtectedBrowserActivity.java
          grep -q 'SOFT_INPUT_ADJUST_RESIZE' app/src/main/java/com/sameerali/appawake/ProtectedBrowserActivity.java
          grep -q 'TOOLBAR_AUTO_HIDE_MS' app/src/main/java/com/sameerali/appawake/ProtectedBrowserActivity.java
          grep -q 'Show browser controls' app/src/main/java/com/sameerali/appawake/ProtectedBrowserActivity.java
          grep -q 'Gravity.TOP | Gravity.CENTER_HORIZONTAL' app/src/main/java/com/sameerali/appawake/ProtectedBrowserActivity.java
          grep -q 'handleParams.setMargins(0, dp(7), 0, 0);' app/src/main/java/com/sameerali/appawake/ProtectedBrowserActivity.java
          if grep -q 'Gravity.TOP | Gravity.END' app/src/main/java/com/sameerali/appawake/ProtectedBrowserActivity.java; then exit 1; fi
          grep -q 'hideToolbar' app/src/main/java/com/sameerali/appawake/ProtectedBrowserActivity.java
          grep -q 'Enter website address' app/src/main/java/com/sameerali/appawake/ProtectedBrowserActivity.java
          grep -q 'Accept-Language' app/src/main/java/com/sameerali/appawake/ProtectedBrowserActivity.java
          grep -q 'appendQueryParameter("hl", "en")' app/src/main/java/com/sameerali/appawake/ProtectedBrowserActivity.java
          if grep -q 'BIND_ACCESSIBILITY_SERVICE' app/src/main/AndroidManifest.xml; then exit 1; fi

      - name: Install stable Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Run foreground-state unit checks
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/run_core_tests.sh
          bash tools/run_core_tests.sh

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK identity, centered browser, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee apk-manifest.txt
          grep -q "package: name='com.sameerali.appawake'" apk-badging.txt
          grep -q "versionCode='13'" apk-badging.txt
          grep -q "versionName='1.7.1'" apk-badging.txt
          grep -q 'HomeActivity' apk-manifest.txt
          grep -q 'ProtectedBrowserActivity' apk-manifest.txt
          if grep -q 'android.permission.BIND_ACCESSIBILITY_SERVICE' apk-manifest.txt; then exit 1; fi
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Prepare downloadable APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Sameer-App-Awake-v1.7.1-CenteredMenu-ProtectedBrowser.apk
          cp apk-badging.txt dist/
          cp apk-manifest.txt dist/
          cp apk-signature.txt dist/
          cp apk-sha256.txt dist/

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Sameer-App-Awake-v1.7.1-CenteredMenu-ProtectedBrowser
          path: dist/
          if-no-files-found: error
          retention-days: 14
