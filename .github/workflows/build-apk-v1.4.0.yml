name: Build App Awake Triple Guard v2.1.0 APK

on:
  push:
    branches:
      - agent/build-apk-v1.4.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply Triple Guard v2.1.0 hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # ------------------------------------------------------------
          # Version bump for this verified artifact.
          # ------------------------------------------------------------
          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text()
          g = g.replace('versionCode = 20', 'versionCode = 21')
          g = g.replace('versionName = "2.0.0"', 'versionName = "2.1.0"')
          g = g.replace('Smart Guard v2.0.0', 'Triple Guard v2.1.0')
          gradle.write_text(g)

          # ------------------------------------------------------------
          # New primary external-app mechanism: an invisible, non-touchable
          # TYPE_APPLICATION_OVERLAY window carrying FLAG_KEEP_SCREEN_ON.
          # The timeout lease + wake lock remain independent backups.
          # ------------------------------------------------------------
          overlay = Path('app/src/main/java/com/sameerali/appawake/ScreenOverlayGuard.java')
          overlay.write_text(r'''package com.sameerali.appawake;

          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.net.Uri;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;

          /**
           * Primary cross-app keep-screen-on mechanism for Sameer App Awake Triple Guard.
           *
           * <p>A 2x2 px, almost-transparent, non-touchable application-overlay window carries
           * FLAG_KEEP_SCREEN_ON while a selected external app such as Google Maps is foreground.
           * The window cannot receive touches or keyboard input and is removed immediately when
           * the selected app leaves the foreground.</p>
           *
           * <p>By: Sameer Ali | Contact: sameer43786@gmail.com</p>
           */
          public final class ScreenOverlayGuard {

              private static WindowManager windowManager;
              private static View guardView;

              private ScreenOverlayGuard() {
              }

              public static boolean canDraw(Context context) {
                  return Settings.canDrawOverlays(context);
              }

              public static Intent permissionIntent(Context context) {
                  return new Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:" + context.getPackageName())
                  );
              }

              public static synchronized boolean engage(Context context) {
                  if (!canDraw(context)) {
                      return false;
                  }
                  if (guardView != null) {
                      return true;
                  }

                  Context app = context.getApplicationContext();
                  WindowManager manager = (WindowManager) app.getSystemService(Context.WINDOW_SERVICE);
                  if (manager == null) {
                      return false;
                  }

                  View view = new View(app);
                  view.setBackgroundColor(Color.TRANSPARENT);
                  WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                          2,
                          2,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                  | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                  | WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT
                  );
                  params.gravity = Gravity.BOTTOM | Gravity.START;
                  params.alpha = 0.01f;
                  params.x = 0;
                  params.y = 0;

                  try {
                      manager.addView(view, params);
                      windowManager = manager;
                      guardView = view;
                      return true;
                  } catch (RuntimeException error) {
                      guardView = null;
                      windowManager = null;
                      return false;
                  }
              }

              public static synchronized void release(Context context) {
                  if (guardView == null || windowManager == null) {
                      guardView = null;
                      windowManager = null;
                      return;
                  }
                  try {
                      windowManager.removeViewImmediate(guardView);
                  } catch (RuntimeException ignored) {
                      // The system can already have removed the overlay during process teardown.
                  } finally {
                      guardView = null;
                      windowManager = null;
                  }
              }
          }
          ''')

          # ------------------------------------------------------------
          # Manifest: request the user-controlled overlay special access.
          # ------------------------------------------------------------
          manifest = Path('app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          if 'android.permission.SYSTEM_ALERT_WINDOW' not in m:
              marker = '    <uses-permission android:name="android.permission.WRITE_SETTINGS" />\n'
              assert marker in m
              m = m.replace(marker, marker + '    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n', 1)
          manifest.write_text(m)

          # ------------------------------------------------------------
          # Main-space UI: guide the user through the two special accesses
          # required for maximum Maps reliability before monitoring starts.
          # ------------------------------------------------------------
          main = Path('app/src/main/java/com/sameerali/appawake/MainActivity.java')
          a = main.read_text()

          old = '    private boolean pendingEnableAfterUsageAccess;\n    private boolean receiverRegistered;'
          new = '    private boolean pendingEnableAfterUsageAccess;\n    private boolean pendingEnableAfterSpecialAccess;\n    private boolean receiverRegistered;'
          assert old in a
          a = a.replace(old, new, 1)

          old = '''        requestNotificationPermissionThenStart();\n    }\n\n    private void requestNotificationPermissionThenStart() {'''
          new = '''        if (!ensureExternalProtectionPermissions()) {\n            return;\n        }\n        requestNotificationPermissionThenStart();\n    }\n\n    private boolean ensureExternalProtectionPermissions() {\n        if (!ScreenOverlayGuard.canDraw(this)) {\n            pendingEnableAfterSpecialAccess = true;\n            setMonitoringSwitch(false);\n            toast("Allow Display over other apps for reliable Google Maps protection.");\n            try {\n                startActivity(ScreenOverlayGuard.permissionIntent(this));\n            } catch (RuntimeException error) {\n                toast("Android could not open the Display over other apps settings.");\n            }\n            return false;\n        }\n\n        if (!TimeoutLeaseGuard.canWrite(this)) {\n            pendingEnableAfterSpecialAccess = true;\n            setMonitoringSwitch(false);\n            toast("Allow Modify system settings as the second reliability layer.");\n            try {\n                startActivity(TimeoutLeaseGuard.permissionIntent(this));\n            } catch (RuntimeException error) {\n                toast("Android could not open the Modify system settings screen.");\n            }\n            return false;\n        }\n\n        pendingEnableAfterSpecialAccess = false;\n        return true;\n    }\n\n    private void requestNotificationPermissionThenStart() {'''
          assert old in a
          a = a.replace(old, new, 1)

          old = '''        if (pendingEnableAfterUsageAccess && PermissionUtils.hasUsageAccess(this)) {\n            pendingEnableAfterUsageAccess = false;\n            requestNotificationPermissionThenStart();\n            return;\n        }\n\n        // Recover a service'''
          new = '''        if (pendingEnableAfterUsageAccess && PermissionUtils.hasUsageAccess(this)) {\n            pendingEnableAfterUsageAccess = false;\n            if (ensureExternalProtectionPermissions()) {\n                requestNotificationPermissionThenStart();\n            }\n            return;\n        }\n\n        if (pendingEnableAfterSpecialAccess) {\n            if (ScreenOverlayGuard.canDraw(this) && TimeoutLeaseGuard.canWrite(this)) {\n                pendingEnableAfterSpecialAccess = false;\n                requestNotificationPermissionThenStart();\n                return;\n            }\n            if (ScreenOverlayGuard.canDraw(this) && !TimeoutLeaseGuard.canWrite(this)) {\n                try {\n                    startActivity(TimeoutLeaseGuard.permissionIntent(this));\n                } catch (RuntimeException ignored) {\n                    // User can reopen the permission screen by enabling monitoring again.\n                }\n                return;\n            }\n        }\n\n        // Recover a service'''
          assert old in a
          a = a.replace(old, new, 1)
          main.write_text(a)

          # ------------------------------------------------------------
          # Service: three independent protection layers for external apps:
          # 1) application overlay + FLAG_KEEP_SCREEN_ON (primary)
          # 2) SCREEN_OFF_TIMEOUT lease (backup)
          # 3) display + CPU wake locks (backup)
          # ------------------------------------------------------------
          service = Path('app/src/main/java/com/sameerali/appawake/AppMonitorService.java')
          s = service.read_text()

          old = '''        AppPreferences.get(this).edit()\n                .putBoolean(AppPreferences.KEY_SERVICE_RUNNING, true)'''
          new = '''        TimeoutLeaseGuard.restoreIfStale(this);\n        ScreenOverlayGuard.release(this);\n\n        AppPreferences.get(this).edit()\n                .putBoolean(AppPreferences.KEY_SERVICE_RUNNING, true)'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        return usageStatsManager != null\n                && powerManager != null\n                && displayWakeLock != null\n                && PermissionUtils.hasUsageAccess(this)'''
          new = '''        return usageStatsManager != null\n                && powerManager != null\n                && (ScreenOverlayGuard.canDraw(this)\n                        || TimeoutLeaseGuard.canWrite(this)\n                        || displayWakeLock != null)\n                && PermissionUtils.hasUsageAccess(this)'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        boolean active;\n        if (!protectedPackage.isEmpty()) {\n            active = acquireOrRenewProtection();\n        } else {\n            releaseProtection();\n            active = false;\n        }\n\n        publishStatus(currentPackage, active ? protectedPackage : "", active, source);'''
          new = '''        boolean active;\n        if (!protectedPackage.isEmpty()) {\n            boolean overlayActive = ScreenOverlayGuard.engage(this);\n            boolean timeoutLeaseActive = TimeoutLeaseGuard.engage(this);\n            TimeoutLeaseGuard.heartbeat(this);\n            boolean wakeLockActive = acquireOrRenewProtection();\n            active = overlayActive || timeoutLeaseActive || wakeLockActive;\n\n            if (overlayActive) {\n                source = source + "+overlay-window";\n            }\n            if (timeoutLeaseActive) {\n                source = source + "+timeout-lease";\n            }\n            if (wakeLockActive) {\n                source = source + "+wakelock-backup";\n            }\n        } else {\n            releaseProtection();\n            active = false;\n        }\n\n        publishStatus(currentPackage, active ? protectedPackage : "", active, source);'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    private synchronized void releaseProtection() {\n        if (displayWakeLock != null && displayWakeLock.isHeld()) {'''
          new = '''    private synchronized void releaseProtection() {\n        ScreenOverlayGuard.release(this);\n        TimeoutLeaseGuard.restore(this);\n        if (displayWakeLock != null && displayWakeLock.isHeld()) {'''
          assert old in s
          s = s.replace(old, new, 1)
          service.write_text(s)

          # ------------------------------------------------------------
          # Protected-browser handle: shift from screen center to 70% width,
          # matching the safe zone marked in the user's screenshot.
          # ------------------------------------------------------------
          browser = Path('app/src/main/java/com/sameerali/appawake/ProtectedBrowserActivity.java')
          b = browser.read_text()
          b = b.replace('Gravity.TOP | Gravity.END', 'Gravity.TOP | Gravity.CENTER_HORIZONTAL')
          b = b.replace('handleParams.setMargins(0, dp(7), dp(7), 0);',
                        'handleParams.setMargins(0, dp(7), 0, 0);')

          anchor = '        root.addView(revealHandle, handleParams);\n'
          replacement = '''        root.addView(revealHandle, handleParams);\n        // Keep the handle away from profile names and common top-right website controls.\n        // Center + 20% of the usable width places it near 70% of the screen width.\n        root.post(() -> revealHandle.setTranslationX(root.getWidth() * 0.20f));\n'''
          assert anchor in b
          b = b.replace(anchor, replacement, 1)

          old = '        revealHandle.setOnClickListener(v -> showToolbar(true));\n'
          new = '''        revealHandle.setOnClickListener(v -> showToolbar(true));\n        revealHandle.setOnLongClickListener(v -> {\n            AppPreferences.clearSmartMode(this);\n            startActivity(new Intent(this, SmartHomeActivity.class)\n                    .putExtra(SmartHomeActivity.EXTRA_CONFIGURE, true));\n            finish();\n            return true;\n        });\n'''
          assert old in b
          b = b.replace(old, new, 1)
          browser.write_text(b)
          PY

      - name: Verify Triple Guard v2.1.0 architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'versionCode = 21' app/build.gradle.kts
          grep -q 'versionName = "2.1.0"' app/build.gradle.kts
          grep -q 'android.permission.WRITE_SETTINGS' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.SYSTEM_ALERT_WINDOW' app/src/main/AndroidManifest.xml
          grep -q 'TYPE_APPLICATION_OVERLAY' app/src/main/java/com/sameerali/appawake/ScreenOverlayGuard.java
          grep -q 'FLAG_KEEP_SCREEN_ON' app/src/main/java/com/sameerali/appawake/ScreenOverlayGuard.java
          grep -q 'ensureExternalProtectionPermissions' app/src/main/java/com/sameerali/appawake/MainActivity.java
          grep -q 'overlay-window' app/src/main/java/com/sameerali/appawake/AppMonitorService.java
          grep -q 'timeout-lease' app/src/main/java/com/sameerali/appawake/AppMonitorService.java
          grep -q 'wakelock-backup' app/src/main/java/com/sameerali/appawake/AppMonitorService.java
          grep -q 'FLAG_KEEP_SCREEN_ON' app/src/main/java/com/sameerali/appawake/ProtectedBrowserActivity.java
          grep -q 'setTranslationX(root.getWidth() \* 0.20f)' app/src/main/java/com/sameerali/appawake/ProtectedBrowserActivity.java
          if grep -q 'BIND_ACCESSIBILITY_SERVICE' app/src/main/AndroidManifest.xml; then exit 1; fi

      - name: Install stable Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Run foreground-state unit checks
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/run_core_tests.sh
          bash tools/run_core_tests.sh

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK identity, Triple Guard components, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee apk-manifest.txt
          grep -q "package: name='com.sameerali.appawake'" apk-badging.txt
          grep -q "versionCode='21'" apk-badging.txt
          grep -q "versionName='2.1.0'" apk-badging.txt
          grep -q "launchable-activity: name='com.sameerali.appawake.SmartHomeActivity'" apk-badging.txt
          grep -q 'android.permission.SYSTEM_ALERT_WINDOW' apk-manifest.txt
          grep -q 'android.permission.WRITE_SETTINGS' apk-manifest.txt
          if grep -q 'android.permission.BIND_ACCESSIBILITY_SERVICE' apk-manifest.txt; then exit 1; fi
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Prepare downloadable APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Sameer-App-Awake-v2.1.0-TripleGuard.apk
          cp apk-badging.txt dist/
          cp apk-manifest.txt dist/
          cp apk-signature.txt dist/
          cp apk-sha256.txt dist/

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Sameer-App-Awake-v2.1.0-TripleGuard
          path: dist/
          if-no-files-found: error
          retention-days: 14
